<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0708">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>VPN Hub</title>
<style>
:root{--bg:#0b0708;--card:#1a1113;--card2:#241619;--line:#3a2226;--tx:#f5eceb;--mut:#b49a9c;--acc:#e5383b;--acc2:#ff6b57;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,rgba(229,56,59,.25),transparent),var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:6px 0 2px;display:flex;align-items:center;gap:8px}h1 i{color:var(--acc);font-style:normal}
.live{width:9px;height:9px;border-radius:50%;background:var(--mut);margin-left:auto}.live.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sub{color:var(--mut);font-size:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.st{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.st b{display:block;font-size:24px}.st span{font-size:12px;color:var(--mut)}
.key{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:10px;margin:10px 0;color:var(--mut);max-height:70px;overflow:auto}
button{font:inherit;border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--card2);color:var(--tx);border:1px solid var(--line)}
button.p{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;font-weight:600}
button.s{padding:6px 10px;font-size:13px}button.d{color:#ff8a8a}button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}.sp{flex:1}
input{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px;flex:1;width:100%;min-width:0}
.m{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#7a1418);display:grid;place-items:center;font-weight:700;flex:none;color:#fff}
.m h3{margin:0;font-size:17px}.m small,.mut{color:var(--mut)}
.dev{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-top:8px;background:var(--bg);border-radius:12px;font-size:14px}
.dev .n{flex:1}.dev small{color:var(--mut)}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:20px 4px 10px}
.lg{font-size:13px;color:var(--mut);padding:6px 0;border-bottom:1px solid var(--line)}.lg:last-child{border:0}
.err{color:#ff8a8a;font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#052;padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:.25s;pointer-events:none}.toast.on{opacity:1}
a.l{color:var(--mut);font-size:13px;cursor:pointer;text-decoration:underline}
</style></head><body>
<div class="w"><h1><i>✦</i> VPN Hub <span class="live" id="live"></span></h1>
<div class="sub">Общий список участников, устройств и ключ</div>
<div id="app"></div>
<p style="text-align:center;margin-top:30px"><a class="l" id="out" hidden>Выйти из группы</a></p></div>
<div class="toast" id="toast"></div>
<script>
addEventListener('error',e=>{document.getElementById('app').innerHTML='<div class="card"><b>Ошибка</b><p class="mut">'+e.message+'</p></div>'});
setTimeout(()=>{if(!window.__ok)document.getElementById('app').innerHTML='<div class="card"><b>Не удалось загрузить Firebase</b><p class="mut">Проверьте интернет или включите VPN (серверы Google могут быть недоступны) и обновите страницу. Если вы открыли файл прямо с компьютера, запустите его через GitHub Pages.</p></div>'},5000);
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {initializeFirestore,persistentLocalCache,doc,collection,onSnapshot,setDoc,updateDoc,addDoc,deleteDoc,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB0pwVC8wEvi9r7A_ZxGIjojznN6UJiQms",authDomain:"vvpn-13cb9.firebaseapp.com",projectId:"vvpn-13cb9",storageBucket:"vvpn-13cb9.firebasestorage.app",messagingSenderId:"980772628709",appId:"1:980772628709:web:c77aed0ed2aed38aec8c0c"};
const fb=initializeApp(firebaseConfig);
let db;try{db=initializeFirestore(fb,{localCache:persistentLocalCache()})}catch(e){db=initializeFirestore(fb,{})}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const $=s=>document.querySelector(s),app=$('#app');
const ICON={phone:'📱',desktop:'🖥️',tablet:'📲'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let code=ls.get('code'),who=ls.get('who'),cfg={key:'',expires:''},members=[],logs=[],unsubs=[];

function login(){
 $('#out').hidden=true;
 app.innerHTML=`<div class="card"><b>🔐 Вход в группу</b><p class="mut">Введите ваше имя и код группы. Код один на всех, его даёт тот, кто создал группу. Новый код создаст новую группу.</p>
 <input id="nm" placeholder="Ваше имя" maxlength="30" value="${esc(who||'')}" style="margin-bottom:8px"><input id="cd" placeholder="Код группы (от 6 символов)" autocapitalize="off" style="margin-bottom:8px"><div class="err" id="er"></div><button class="p" id="go" style="width:100%">Войти</button></div>`;
 $('#go').onclick=()=>{const n=$('#nm').value.trim(),c=$('#cd').value.trim().toLowerCase().replace(/[\/\s]/g,'');
  if(!n)return $('#er').textContent='Введите имя';if(c.length<6)return $('#er').textContent='Код должен быть от 6 символов';
  who=n;code=c;ls.set('who',n);ls.set('code',c);start()};
}
function start(){
 unsubs.forEach(u=>u());unsubs=[];cfg={key:'',expires:''};members=[];logs=[];
 $('#out').hidden=false;render();
 const live=ok=>$('#live').classList.toggle('on',ok);
 const err=e=>{app.innerHTML=`<div class="card"><b>Нет доступа</b><p class="mut">${esc(e.message)}</p></div>`};
 unsubs.push(onSnapshot(doc(db,'g',code,'d','main'),{includeMetadataChanges:true},s=>{live(!s.metadata.fromCache);cfg={key:'',expires:'',...(s.data()||{})};render()},err));
 unsubs.push(onSnapshot(collection(db,'g',code,'members'),s=>{members=s.docs.map(d=>({id:d.id,devices:[],...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));render()},err));
 unsubs.push(onSnapshot(query(collection(db,'g',code,'log'),orderBy('ts','desc'),limit(15)),s=>{logs=s.docs.map(d=>d.data());render()},()=>{}));
}
const mc=id=>doc(db,'g',code,'members',id);
const note=t=>addDoc(collection(db,'g',code,'log'),{text:`${who} ${t}`,ts:Date.now()}).catch(()=>{});
const days=()=>cfg.expires?Math.max(0,Math.ceil((new Date(cfg.expires)-new Date())/864e5)):'—';
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Скопировано ✓')}
const fmt=ts=>new Date(ts).toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

function render(){
 if(!code)return;
 const keep=($('#nn')||{}).value||'';
 const dc=members.reduce((a,m)=>a+m.devices.length,0);
 let h=`<div class="stats"><div class="st"><b>${members.length}</b><span>участников</span></div><div class="st" id="sd" style="cursor:pointer"><b>${cfg.devices!=null?cfg.devices:dc}</b><span>устройств ✎</span></div><div class="st"><b>${days()}</b><span>дней осталось</span></div></div>
 <div class="card"><div class="row"><b>🔑 Ключ доступа</b><span class="sp"></span><button class="s" id="ek">Изменить</button></div>
 <div class="key">${cfg.key?esc(cfg.key):'Ключ ещё не добавлен'}</div>
 <button class="p" id="ck" style="width:100%" ${cfg.key?'':'disabled'}>Скопировать ключ</button></div>
 <div class="card"><div class="row"><b>📅 Подписка до</b><span class="sp"></span><input type="date" id="ex" value="${esc(cfg.expires)}" style="max-width:170px"></div></div><h2>Участники</h2>`;
 if(!members.length)h+='<p class="mut" style="text-align:center">Пока никого нет</p>';
 members.forEach((m,mi)=>{h+=`<div class="card"><div class="m"><div class="av">${esc((m.name[0]||'?').toUpperCase())}</div><div class="sp"><h3 data-a="ren" data-m="${mi}">${esc(m.name)}</h3><small>${m.devices.length} устр.</small></div><button class="s" data-a="add" data-m="${mi}">＋ устройство</button><button class="s d" data-a="del" data-m="${mi}">✕</button></div>`;
  m.devices.forEach((d,i)=>{h+=`<div class="dev"><span>${ICON[d.t]||'🔌'}</span><span class="n">${esc(d.n)}${d.by?` <small>· ${esc(d.by)}</small>`:''}</span><button class="s d" data-a="rd" data-m="${mi}" data-i="${i}">✕</button></div>`});h+='</div>'});
 h+=`<div class="card"><div class="row"><input id="nn" placeholder="Имя нового участника" maxlength="40" value="${esc(keep)}"><button class="p" id="an">Добавить</button></div></div>`;
 if(logs.length)h+='<h2>История</h2><div class="card">'+logs.map(l=>`<div class="lg">${esc(l.text)} · ${fmt(l.ts)}</div>`).join('')+'</div>';
 app.innerHTML=h;
 $('#ck').onclick=()=>copy(cfg.key);
 $('#sd').onclick=()=>{const cur=cfg.devices!=null?cfg.devices:'';const v=prompt('Сколько устройств подключено? Оставьте пустым, чтобы считать по списку ('+dc+').',cur);if(v===null)return;const t=v.trim();
  if(t===''){setDoc(doc(db,'g',code,'d','main'),{devices:null},{merge:true});note('включил автоподсчёт устройств')}
  else{const n=parseInt(t,10);if(isNaN(n)||n<0)return toast('Введите число');setDoc(doc(db,'g',code,'d','main'),{devices:n},{merge:true});note('указал количество устройств: '+n)}};
 $('#ek').onclick=()=>{const k=prompt('Новый ключ / ссылка подписки:',cfg.key);if(k===null)return;setDoc(doc(db,'g',code,'d','main'),{key:k.trim()},{merge:true});note('обновил ключ')};
 $('#ex').onchange=e=>{setDoc(doc(db,'g',code,'d','main'),{expires:e.target.value},{merge:true});note('изменил дату подписки')};
 $('#an').onclick=()=>{const n=$('#nn').value.trim();if(!n)return;$('#nn').value='';setDoc(mc('m'+Date.now()),{name:n,devices:[],ts:Date.now()});note('добавил участника '+n)};
 app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const m=members[+b.dataset.m],a=b.dataset.a;
  if(a==='add'){const n=prompt('Название устройства (напр. iPhone 13 mini):');if(!n)return;const t={'1':'phone','2':'desktop','3':'tablet'}[prompt('Тип: 1 — телефон, 2 — ПК, 3 — планшет','1')]||'phone';updateDoc(mc(m.id),{devices:[...m.devices,{n:n.trim(),t,by:who}]});note(`добавил устройство ${n.trim()} → ${m.name}`)}
  if(a==='rd'){const d=m.devices[+b.dataset.i];if(confirm('Удалить '+d.n+'?')){updateDoc(mc(m.id),{devices:m.devices.filter((_,i)=>i!==+b.dataset.i)});note(`удалил устройство ${d.n} у ${m.name}`)}}
  if(a==='del'&&confirm('Удалить участника '+m.name+'?')){deleteDoc(mc(m.id));note('удалил участника '+m.name)}
  if(a==='ren'){const n=prompt('Новое имя:',m.name);if(n&&n.trim()){updateDoc(mc(m.id),{name:n.trim()});note(`переименовал ${m.name} → ${n.trim()}`)}}});
}
$('#out').onclick=()=>{if(!confirm('Выйти из группы на этом устройстве?'))return;unsubs.forEach(u=>u());ls.del('code');code=null;login()};
window.__ok=true;
code&&who?start():login();
</script></body></html>
